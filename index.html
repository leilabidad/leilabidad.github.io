<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leila Bidad | AI Researcher</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, #172554 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #312e81 0%, transparent 35%),
                #020617;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 900px;
        }

        .name {
            font-size: clamp(3rem, 9vw, 7rem);
            font-weight: 800;
            letter-spacing: -4px;
            margin-bottom: 20px;
        }

        .title {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #a5b4fc;
            margin-bottom: 25px;
        }

        .description {
            max-width: 700px;
            margin: auto;
            line-height: 1.8;
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        .buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .button {
            text-decoration: none;
            color: white;
            border: 1px solid #6366f1;
            padding: 13px 25px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .button:hover {
            background: #6366f1;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="content">

            <div class="name">
                Leila Bidad
            </div>

            <div class="title">
                AI Researcher · Software Engineer
            </div>

            <p class="description">
                Researching Agentic AI, Medical Imaging,
                Multimodal Learning, Computer Vision and
                Large Language Models.
            </p>

            <div class="buttons">
                <a class="button" href="#research">
                    Research
                </a>

                <a class="button" href="#projects">
                    Projects
                </a>

                <a class="button"
                   href="https://github.com/leilabidad">
                    GitHub
                </a>
            </div>

        </div>
    </section>

</body>
</html>
